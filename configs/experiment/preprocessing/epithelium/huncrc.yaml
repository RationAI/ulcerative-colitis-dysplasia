# @package _global_

#: Served by the HUNCRC model RayService -- NOT the SDK default (AsyncClient ->
#: rayservice-model-serve-svc, the IBD deployment, which has no hunCRC replicas).
svc: "http://rayservice-model-huncrc-serve-svc.rationai-jobs-ns.svc.cluster.local:8000"
model: "episeg-1"
#: 4 in-flight requests, not 1: the 200-slide cohort at the huncrc service's real
#: per-slide time (~30+ min, incl. the first request's TensorRT cold start) would be
#: 4+ days serial. The GPU processes the slides queue-side; concurrency bounds client
#: connections, not GPU work. Raise deliberately with the service owner, do not lower.
max_concurrent: 4
#: Bounds BOTH the client connection and each heatmap request (the SDK's built-in
#: per-request default is 1000 s). The first request after a reroll cold-starts the
#: GPU + rebuilds the TensorRT engine in ~1544 s measured; 18000 s (5 h) has headroom.
request_timeout: 18000
