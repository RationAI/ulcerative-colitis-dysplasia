# @package _global_

#: hunCRC tile-embedding training data: local tiling_186_merged (with the
#: split column from scripts/add_split_column.py) + prov-gigapath embedding
#: parquets. Labels come from the TILING -- the label columns inside the
#: embedding parquets were written by an earlier tiling generation and
#: disagree with the current one.
dataset:
  tiling_dir: ${project_path}/tiling_186_merged
  embeddings_dir: ${project_path}/embeddings_186_v3/prov-gigapath
  #: null = every slide that has an embedding parquet; int = first N slides
  #: per split (smoke tests / debug runs).
  max_slides: null
  #: Serial-sections filter (2D-connected pieces within cluster_k * stride;
  #: on annotated slides only the annotated pieces are kept). 2.0 validated
  #: against the cohort: closest two distinct pieces anywhere = 2.236*stride,
  #: so pieces never merge and one missing-tile hole is bridged.
  #: null = off (every tile is a sample, unannotated = negative).
  cluster_k: 2.0

data:
  _target_: ml.data.DataModule
  batch_size: 256
  #: Each dataset preloads its split's vectors in __init__; the forked workers
  #: share that array copy-on-write, so this no longer multiplies the vectors.
  num_workers: 4
  datasets:
    train:
      _target_: ml.data.embeddings_dataset.DysplasiaEmbeddingsDataset
      tiling_dir: ${dataset.tiling_dir}
      embeddings_dir: ${dataset.embeddings_dir}
      split: train
      max_slides: ${dataset.max_slides}
      cluster_k: ${dataset.cluster_k}
    val:
      _target_: ml.data.embeddings_dataset.DysplasiaEmbeddingsDataset
      tiling_dir: ${dataset.tiling_dir}
      embeddings_dir: ${dataset.embeddings_dir}
      split: test_preliminary
      max_slides: ${dataset.max_slides}
      cluster_k: ${dataset.cluster_k}
    test:
      _target_: ml.data.embeddings_dataset.DysplasiaEmbeddingsDataset
      tiling_dir: ${dataset.tiling_dir}
      embeddings_dir: ${dataset.embeddings_dir}
      split: test_final
      max_slides: ${dataset.max_slides}
      cluster_k: ${dataset.cluster_k}
