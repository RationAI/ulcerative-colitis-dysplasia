defaults:
  - /dataset/processed@_here_
  - /dataset/processed_w_tissue@_here_
  - _self_

#: No episeg run yet, so point `epithelium` at the tissue masks as a stand-in. It is
#: the tissue masks' MLflow URI (self-referenced, so it can't drift from the real one);
#: preprocessing/tiling.py reuses the already-downloaded tissue folder in that case.
#: Switching to the real masks later = change this one value to the episeg output dir
#: (${project_path}/epithelium_masks/raw) or its MLflow URI. No code change needed.
epithelium: ${mlflow_uris.tissue}

mlflow_uris:
  qc: mlflow-artifacts:/111/10ec53e2cefd4e589e2d76d3373c8286/artifacts/qc_output
  splits:
      train: mlflow-artifacts:/111/e8175ecf823d403ca5b629a9bb3cf874/artifacts/train.csv
      test_preliminary: mlflow-artifacts:/111/e8175ecf823d403ca5b629a9bb3cf874/artifacts/test_preliminary.csv
      test_final: mlflow-artifacts:/111/e8175ecf823d403ca5b629a9bb3cf874/artifacts/test_final.csv