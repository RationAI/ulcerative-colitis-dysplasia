#: TCIA_HunCRC — slides are bare `NNN.mrxs`, not the IBD `NN_NN_HE_X` names.
slides_path: /mnt/data/Public/Public/colorectum/TCIA_HunCRC/PKG - Hungarian-Colorectal-Screening_v2
tiles_path: /mnt/data/Public/Public/colorectum/TCIA_HunCRC/PKG - Hungarian-Colorectal-Screening_ML-dataset/ML_dataset
#: get_df matches against slide_path.name, so the extension is part of the string.
#: Anchored so a stray directory entry cannot slip in and poison case_id.
regex_pattern: '^\d{3}\.mrxs$'
