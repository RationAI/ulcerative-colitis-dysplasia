# @package _global_

#: hunCRC FULL-COHORT (200) tile-embedding training data -- LABEL POLICY v2
#: (doc.md section 7, decided 2026-11-05). Same tiling_200 grid and
#: prov-gigapath embeddings as embeddings_huncrc200, but the samples,
#: labels and per-sample weights come from the precomputed v2 training
#: table (preprocessing/training_tiles, built by
#: scripts/make_training_tiles.py from the restamped 9-class coverage +
#: slide-level diagnosis + QC blur/artifacts):
#:   * positives = LGD/HGD tiles (re-derived from the current EMPIA JSONs,
#:     not the stale tiling columns)
#:   * negatives = normal/inflammation tiles only (unannotated tiles on
#:     neoplastic slides, all carcinoma/SFI/necrosis tiles and blurred /
#:     QC-artifact tiles are excluded, not negative)
#:   * neoplastic-slide negatives are down-weighted (0.5)
#: Hence cluster_k is OFF -- the table already encodes the
#: annotated-pieces rule, and the two filters must not stack.
dataset:
  tiling_dir: ${project_path}/preprocessing/tiling_200
  embeddings_dir: ${project_path}/preprocessing/embeddings/prov-gigapath
  max_slides: null
  cluster_k: null
  label_table_dir: ${project_path}/preprocessing/training_tiles

data:
  _target_: ml.data.DataModule
  batch_size: 256
  num_workers: 4
  datasets:
    train:
      _target_: ml.data.embeddings_dataset.DysplasiaEmbeddingsDataset
      tiling_dir: ${dataset.tiling_dir}
      embeddings_dir: ${dataset.embeddings_dir}
      split: train
      max_slides: ${dataset.max_slides}
      cluster_k: ${dataset.cluster_k}
      label_table_dir: ${dataset.label_table_dir}
    val:
      _target_: ml.data.embeddings_dataset.DysplasiaEmbeddingsDataset
      tiling_dir: ${dataset.tiling_dir}
      embeddings_dir: ${dataset.embeddings_dir}
      split: test_preliminary
      max_slides: ${dataset.max_slides}
      cluster_k: ${dataset.cluster_k}
      label_table_dir: ${dataset.label_table_dir}
    test:
      _target_: ml.data.embeddings_dataset.DysplasiaEmbeddingsDataset
      tiling_dir: ${dataset.tiling_dir}
      embeddings_dir: ${dataset.embeddings_dir}
      split: test_final
      max_slides: ${dataset.max_slides}
      cluster_k: ${dataset.cluster_k}
      label_table_dir: ${dataset.label_table_dir}
